<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>quizmake</title>
    <meta
      name="description"
      content="問題を解いて即座に解説を確認できる学習アプリ。ブックマーク・間隔反復・学習記録に対応しています。"
    />

    <!-- SNSで共有されたときの表示（画像はホームページ側に置いてある1枚を使う） -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.quiz-make.com/" />
    <meta property="og:title" content="quizmake｜自分でつくる問題集アプリ" />
    <meta
      property="og:description"
      content="覚えたいことを自分で問題にして、繰り返し解ける学習アプリ。登録不要・無料。"
    />
    <meta property="og:image" content="https://quiz-make.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="quizmake" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quiz-make.com/og.png" />

    <!-- PWA（ホーム画面に追加してアプリとして起動できるようにする） -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- iOS / iPadOS のホーム画面用 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="quizmake" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      アクセス解析（Cloudflare Web Analytics）。Cookie を使わず、個人を追跡しない。
      開発中（localhost）は読み込まない。登録したドメイン以外からは受け付けられず、
      コンソールに CORS のエラーが出るだけになるため。
    -->
    <script>
      if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        var beacon = document.createElement('script')
        beacon.defer = true
        beacon.src = 'https://static.cloudflareinsights.com/beacon.min.js'
        beacon.setAttribute('data-cf-beacon', '{"token": "ed5e735da2454739a56f170afc19c275"}')
        document.head.appendChild(beacon)
      }
    </script>
  </body>
</html>
